<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이벤트 신청</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="page-header">
  <h1>이벤트 신청</h1>
  <p class="subtitle">아래 내용을 입력하시면 접수됩니다.</p>
</header>

<main>

  <!-- ========== 신청 폼 ========== -->
  <section class="card">
    <h2>신청서 작성</h2>

    <form id="apply-form">
      <div class="field">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" placeholder="이름을 입력하세요" required>
      </div>

      <div class="field">
        <label for="phone">연락처</label>
<input type="tel" id="phone" name="phone"
       inputmode="numeric"
       pattern="[0-9]{10,11}"
       maxlength="11"
       placeholder="01012345678"
       required>
      </div>

      <div class="field">
        <label for="message">신청 내용 <span class="optional">(선택)</span></label>
        <textarea id="message" name="message" rows="4" placeholder="하실 말씀이 있으면 적어주세요"></textarea>
      </div>

      <button type="submit" id="submit-btn">신청하기</button>
    </form>
  </section>

  <!-- ========== 상태 메시지 ========== -->
  <p id="status" class="status" role="status"></p>

  <!-- ========== 학습용 안내 ========== -->
  <section class="card notice">
    <h2>⚠️ 학습용 페이지입니다</h2>
    <p>
      실제 개인정보를 입력하지 마세요. 실명·실제 전화번호 대신
      <code>홍길동</code>, <code>010-0000-0000</code> 같은 가짜 데이터만 사용하세요.
    </p>
    <p class="dim">
      이 페이지에서 보낸 신청은 <strong>저장은 되지만 조회는 되지 않습니다.</strong>
      관리자 로그인을 붙이기 전까지는 아무도 목록을 볼 수 없습니다.
    </p>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="apply.js"></script>

</body>
</html>
